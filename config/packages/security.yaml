security:
    # Şifreleme ayarları (PasswordEncoder / PasswordHasher)
    password_hashers:
        App\Infrastructure\Security\SecurityUser: 'auto'

    providers:
        # Veritabanından kullanıcı yükleme sağlayıcısı
        # Kullanıcılar UserRepository portu üzerinden yüklenir (Infrastructure/Security)
        app_user_provider:
            id: App\Infrastructure\Security\SecurityUserProvider

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # Login API uç noktası (JWT Token almak için herkesin erişimine açık)
        login:
            pattern: ^/api/login
            stateless: true
            json_login:
                check_path: /api/login_check
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # Genel API firewall'u (JWT korumalı)
        api:
            pattern: ^/api
            stateless: true
            jwt: ~

        main:
            lazy: true
            provider: app_user_provider

    # Rol Bazlı Erişim Kontrolü (RBAC) Kuralları
    # ROLE_USER = Çalışan, ROLE_ADMIN = Yönetici
    access_control:
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        # Yöneticiye özel uç noktalar (bekleyen izinler, onay/ret, kullanıcı yönetimi)
        - { path: ^/api/admin, roles: ROLE_ADMIN }
        # Giriş yapmış herkes (çalışan ve yönetici)
        - { path: ^/api, roles: ROLE_USER }
